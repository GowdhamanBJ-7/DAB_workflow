# This is a Databricks asset bundle definition for demo_analytics_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: demo_analytics_bundle
  uuid: 7c6813c8-9782-46d7-b619-fc290718dcb5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a8b5283c-41bc.cloud.databricks.com
    variables:
      catalog: main
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-a8b5283c-41bc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gowdhaman.bj@diggibyte.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gowdhaman.bj@diggibyte.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: nyc_taxi
    permissions:
      - user_name: gowdhaman.bj@diggibyte.com
        level: CAN_MANAGE
